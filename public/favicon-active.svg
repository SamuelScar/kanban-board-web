<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes spin {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .edge {
      fill: none;
      stroke: #84a98c;
      stroke-linecap: round;
      animation: spin 2.5s linear infinite;
    }
  </style>
  
  <!-- Cauda de cometa! -->
  <rect x="4" y="4" width="92" height="92" rx="20" pathLength="100" class="edge" stroke-width="2" stroke-dasharray="25 75" stroke-opacity="0.1" style="animation-delay: 0s;" />
  <rect x="4" y="4" width="92" height="92" rx="20" pathLength="100" class="edge" stroke-width="4" stroke-dasharray="15 85" stroke-opacity="0.4" style="animation-delay: -0.1s;" />
  <rect x="4" y="4" width="92" height="92" rx="20" pathLength="100" class="edge" stroke-width="6" stroke-dasharray="5 95" stroke-opacity="1.0" style="animation-delay: -0.2s;" />
  
  <!-- Coluna Terracota (Esquerda) -->
  <rect x="20" y="25" width="16" height="50" rx="8" fill="#c65e43" />
  <!-- Coluna Areia/Mel (Centro) -->
  <rect x="42" y="35" width="16" height="40" rx="8" fill="#e8ba71" />
  <!-- Coluna Sage Green (Direita) -->
  <rect x="64" y="20" width="16" height="55" rx="8" fill="#84a98c" />
</svg>
